name: Verificar aplicação
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: sisroteiro_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:mysql
        env:
          TEST_DATABASE_URL: mysql://root:integration-only-password@127.0.0.1:3306/sisroteiro_test
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas-responsivas
          path: artifacts/*.png
          if-no-files-found: ignore
